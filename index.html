<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shakabro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root {
  --black:#000;
  --white:#fff;
  --g300:#999;
  --g500:#555;
  --g700:#222;
  --g800:#111;
  --g850:#0d0d0d;
  --border:1px solid #1e1e1e;

  --c-firing:#00e5ff;
  --c-good:#39ff14;
  --c-fair:#ffcc00;
  --c-poor:#ff3b30;
}

html,body{background:var(--black);color:var(--white);font-family:'Space Grotesk',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* ── WAVE CANVAS ─────────────────────────────── */
#waveCanvas{position:fixed;bottom:0;left:0;width:100%;height:220px;pointer-events:none;z-index:0;opacity:0.18;}

/* ── LAYOUT ──────────────────────────────────── */
.app{max-width:980px;margin:0 auto;padding:0 24px 100px;position:relative;z-index:1;}

/* ── HEADER ──────────────────────────────────── */
header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 28px;border-bottom:var(--border);gap:14px;flex-wrap:wrap;}
.logo{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;letter-spacing:-0.5px;color:var(--white);}
.logo span{color:var(--g500);font-weight:400;}
.header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.api-input-wrap{display:flex;align-items:center;gap:8px;border:var(--border);padding:6px 12px;background:var(--g800);}
.api-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g500);white-space:nowrap;}
.api-input{background:transparent;border:none;outline:none;color:var(--g300);font-family:'Space Mono',monospace;font-size:11px;width:200px;}
.refresh-btn{background:var(--white);color:var(--black);border:none;padding:9px 22px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:transform 0.15s cubic-bezier(.34,1.56,.64,1),opacity 0.15s;white-space:nowrap;}
.refresh-btn:hover{transform:scale(1.04);opacity:0.9;}
.refresh-btn:active{transform:scale(0.97);}
.refresh-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

/* ── LOCATION BAR ────────────────────────────── */
.location-bar{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:var(--border);}
.location-name{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--g300);}
.location-coords{font-family:'Space Mono',monospace;font-size:10px;color:var(--g500);letter-spacing:1px;}
.timestamp{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--g500);letter-spacing:1px;}

/* ── HERO ────────────────────────────────────── */
.hero{padding:52px 0 44px;border-bottom:var(--border);position:relative;}
.hero-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--g500);margin-bottom:14px;}

.hero-rating{
  font-family:'Space Mono',monospace;
  font-size:clamp(60px,13vw,118px);
  font-weight:700;
  line-height:0.88;
  letter-spacing:-4px;
  margin-bottom:8px;
  opacity:0;
  transform:translateY(24px);
  transition:opacity 0.6s cubic-bezier(.22,1,.36,1),transform 0.6s cubic-bezier(.22,1,.36,1),color 0.4s,text-shadow 0.4s;
}
.hero-rating.visible{opacity:1;transform:translateY(0);}
.hero-rating.firing{color:var(--c-firing);text-shadow:0 0 60px rgba(0,229,255,0.35),0 0 120px rgba(0,229,255,0.15);}
.hero-rating.good{color:var(--c-good);text-shadow:0 0 60px rgba(57,255,20,0.3),0 0 120px rgba(57,255,20,0.12);}
.hero-rating.fair{color:var(--c-fair);text-shadow:0 0 40px rgba(255,204,0,0.25);}
.hero-rating.poor{color:var(--c-poor);text-shadow:0 0 40px rgba(255,59,48,0.2);}

/* score ring */
.hero-bottom{display:flex;align-items:center;gap:40px;flex-wrap:wrap;margin-top:28px;}
.score-ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0;opacity:0;transform:scale(0.7);transition:opacity 0.5s 0.2s cubic-bezier(.34,1.56,.64,1),transform 0.5s 0.2s cubic-bezier(.34,1.56,.64,1);}
.score-ring-wrap.visible{opacity:1;transform:scale(1);}
.score-ring-svg{width:110px;height:110px;}
.ring-track{fill:none;stroke:#1a1a1a;stroke-width:6;}
.ring-fill{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:282.7;stroke-dashoffset:282.7;transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1) 0.3s,stroke 0.4s;}
.ring-text{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;dominant-baseline:central;text-anchor:middle;fill:white;}
.ring-sub{font-family:'Space Mono',monospace;font-size:9px;dominant-baseline:central;text-anchor:middle;fill:#555;letter-spacing:2;}

.hero-breakdown{font-size:15px;color:var(--g300);line-height:1.7;max-width:500px;font-weight:400;opacity:0;transform:translateY(12px);transition:opacity 0.5s 0.35s ease,transform 0.5s 0.35s ease;}
.hero-breakdown.visible{opacity:1;transform:translateY(0);}

/* ── SECTION HEADER ──────────────────────────── */
.section-header{padding:36px 0 0;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--g500);border-bottom:var(--border);padding-bottom:0;margin-bottom:0;line-height:1;padding-bottom:14px;}

/* ── STATS GRID ──────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:var(--border);}

.stat-card{
  padding:26px 20px 22px;
  border-right:var(--border);
  position:relative;
  cursor:default;
  overflow:hidden;
  transition:background 0.25s cubic-bezier(.34,1.56,.64,1);
}
.stat-card:last-child{border-right:none;}
.stat-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.03) 0%,transparent 60%);opacity:0;transition:opacity 0.25s;}
.stat-card:hover::after{opacity:1;}
.stat-card:hover{background:var(--g850);}

/* quality bar at top */
.stat-bar{height:2px;width:100%;margin-bottom:18px;background:#1a1a1a;position:relative;overflow:hidden;}
.stat-bar-fill{height:100%;width:0%;transition:width 1s cubic-bezier(.34,1.56,.64,1) 0.4s;}
.stat-bar-fill.good{background:var(--c-good);}
.stat-bar-fill.fair{background:var(--c-fair);}
.stat-bar-fill.poor{background:var(--c-poor);}
.stat-bar-fill.firing{background:var(--c-firing);}

.stat-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--g500);margin-bottom:10px;}
.stat-value{font-family:'Space Mono',monospace;font-size:30px;font-weight:700;line-height:1;letter-spacing:-1px;margin-bottom:5px;}
.stat-unit{font-size:13px;color:var(--g500);font-weight:400;letter-spacing:0;}
.stat-sub{font-size:11px;color:var(--g500);margin-top:5px;font-family:'Space Grotesk',sans-serif;}
.stat-quality-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 6px;border:1px solid #1e1e1e;color:var(--g500);margin-top:8px;transition:border-color 0.3s,color 0.3s;}
.stat-card:hover .stat-quality-tag.good{border-color:var(--c-good);color:var(--c-good);}
.stat-card:hover .stat-quality-tag.fair{border-color:var(--c-fair);color:var(--c-fair);}
.stat-card:hover .stat-quality-tag.poor{border-color:var(--c-poor);color:var(--c-poor);}

/* ── DIRECTION COMPASS TOOLTIP ───────────────── */
.stat-card[data-dir]{position:relative;}
.dir-tooltip{
  position:absolute;
  bottom:calc(100% + 10px);
  left:50%;
  transform:translateX(-50%) translateY(6px) scale(0.92);
  background:#0d0d0d;
  border:var(--border);
  padding:16px;
  width:140px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s cubic-bezier(.34,1.56,.64,1),transform 0.25s cubic-bezier(.34,1.56,.64,1);
  z-index:100;
}
.stat-card[data-dir]:hover .dir-tooltip{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
.compass-svg{display:block;margin:0 auto 10px;}
.dir-label{text-align:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--g300);letter-spacing:2px;}
.dir-deg{text-align:center;font-family:'Space Mono',monospace;font-size:9px;color:var(--g500);margin-top:3px;letter-spacing:1px;}

/* ── TIMELINE ────────────────────────────────── */
.timeline-section{padding-top:6px;}
.day-label{padding:26px 0 14px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--g500);border-bottom:var(--border);}
.timeline-row{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:var(--border);}

.time-slot{
  padding:22px 18px;
  border-right:var(--border);
  position:relative;
  transition:background 0.2s cubic-bezier(.34,1.56,.64,1),transform 0.2s cubic-bezier(.34,1.56,.64,1);
  cursor:default;
  overflow:hidden;
}
.time-slot:last-child{border-right:none;}
.time-slot:hover{background:var(--g850);}
.time-slot.best-window{background:#080808;}
.time-slot.best-window::before{
  content:'BEST';
  position:absolute;top:10px;right:14px;
  font-family:'Space Mono',monospace;font-size:7px;letter-spacing:2px;color:var(--g500);
}

/* score pill */
.slot-time{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:14px;color:var(--g500);}
.slot-score-pill{
  display:inline-flex;align-items:center;justify-content:center;
  width:48px;height:48px;
  border-radius:50%;
  font-family:'Space Mono',monospace;font-size:14px;font-weight:700;
  margin-bottom:10px;
  border:2px solid;
  transition:transform 0.3s cubic-bezier(.34,1.56,.64,1),box-shadow 0.3s;
  opacity:0;transform:scale(0.5);
}
.slot-score-pill.visible{opacity:1;transform:scale(1);}
.time-slot:hover .slot-score-pill{transform:scale(1.12);}

.slot-score-pill.firing{color:var(--c-firing);border-color:var(--c-firing);box-shadow:0 0 20px rgba(0,229,255,0.3);}
.slot-score-pill.good{color:var(--c-good);border-color:var(--c-good);box-shadow:0 0 20px rgba(57,255,20,0.25);}
.slot-score-pill.fair{color:var(--c-fair);border-color:var(--c-fair);box-shadow:0 0 16px rgba(255,204,0,0.2);}
.slot-score-pill.poor{color:var(--c-poor);border-color:var(--c-poor);}

.slot-tag{display:block;font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g500);margin-bottom:10px;}
.slot-detail{font-size:10px;color:var(--g500);line-height:1.7;font-family:'Space Grotesk',sans-serif;}

/* ── STATES ──────────────────────────────────── */
.state-block{padding:80px 0;text-align:center;}
.state-message{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--g500);margin-bottom:12px;}
.state-sub{font-size:13px;color:var(--g700);}
.spinner{display:inline-block;width:28px;height:28px;border:2px solid #1e1e1e;border-top-color:var(--white);border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-banner{background:#0a0000;border:1px solid #3a0a0a;padding:14px 20px;margin-top:28px;font-family:'Space Mono',monospace;font-size:11px;color:#cc4444;letter-spacing:1px;display:none;}
.error-banner.visible{display:block;}

/* ── FOOTER ──────────────────────────────────── */
footer{padding:28px 0;border-top:var(--border);margin-top:32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.footer-note{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--g700);text-transform:uppercase;}

/* ── RESPONSIVE ──────────────────────────────── */
@media(max-width:700px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .stat-card:nth-child(2){border-right:none;}
  .stat-card:nth-child(3){border-right:var(--border);}
  .timeline-row{grid-template-columns:repeat(2,1fr);}
  .time-slot:nth-child(2){border-right:none;}
  .time-slot:nth-child(3){border-right:var(--border);}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .timeline-row{grid-template-columns:1fr 1fr;}
}

/* ── ENTER ANIMATIONS ────────────────────────── */
.fade-up{opacity:0;transform:translateY(20px);transition:opacity 0.5s cubic-bezier(.22,1,.36,1),transform 0.5s cubic-bezier(.22,1,.36,1);}
.fade-up.visible{opacity:1;transform:translateY(0);}

/* ══════════════════════════════════════════════
   MOTION LAYER — cinematic, physics, magnetic
══════════════════════════════════════════════ */

/* Custom cursor */
#cursor-dot{position:fixed;top:0;left:0;width:8px;height:8px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9999;mix-blend-mode:difference;transition:transform 0.08s;}
#cursor-ring{position:fixed;top:0;left:0;width:36px;height:36px;border:1px solid rgba(255,255,255,0.35);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9998;transition:width 0.35s cubic-bezier(.34,1.56,.64,1),height 0.35s cubic-bezier(.34,1.56,.64,1),border-color 0.3s,opacity 0.3s;}
#cursor-ring.hovering{width:58px;height:58px;border-color:rgba(255,255,255,0.12);}
#cursor-ring.clicking{width:22px;height:22px;border-color:rgba(255,255,255,0.9);}
body{cursor:none;}

/* Page entrance — hard clip wipe upward */
@keyframes pageReveal{
  0%{clip-path:inset(100% 0 0 0);opacity:0;}
  2%{opacity:1;}
  100%{clip-path:inset(0% 0 0 0);}
}
.app{animation:pageReveal 1s cubic-bezier(.16,1,.3,1) forwards;}

/* Header drop-in */
header{opacity:0;animation:headerIn 0.85s cubic-bezier(.16,1,.3,1) 0.1s forwards;}
@keyframes headerIn{from{opacity:0;transform:translateY(-100%);}to{opacity:1;transform:translateY(0);}}

/* Logo inner reveal */
.logo-inner{display:inline-block;animation:logoSlide 1s cubic-bezier(.16,1,.3,1) 0.25s both;}
@keyframes logoSlide{from{transform:translateY(110%);}to{transform:translateY(0);}}

/* Location bar scan-line sweep */
.location-bar{position:relative;overflow:hidden;}
.location-bar::after{content:'';position:absolute;left:-100%;top:0;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);animation:scanLine 2s cubic-bezier(.4,0,.2,1) 0.9s forwards;pointer-events:none;}
@keyframes scanLine{0%{left:-60%;}100%{left:160%;}}

/* Hero rating: char-by-char clip reveal */
.hero-rating{overflow:hidden !important;opacity:1 !important;transform:none !important;}
.hero-rating .char-wrap{display:inline-block;overflow:hidden;vertical-align:bottom;}
.hero-rating .char{display:inline-block;animation:charReveal 0.65s cubic-bezier(.16,1,.3,1) both;}
@keyframes charReveal{from{transform:translateY(110%) skewY(5deg);opacity:0;}to{transform:translateY(0) skewY(0deg);opacity:1;}}

/* Score ring spin-in */
.score-ring-wrap{opacity:1 !important;transform:none !important;}
.score-ring-svg{animation:ringIn 1.1s cubic-bezier(.34,1.56,.64,1) 0.45s both;}
@keyframes ringIn{0%{transform:scale(0) rotate(-200deg);opacity:0;}70%{opacity:1;}100%{transform:scale(1) rotate(0deg);opacity:1;}}

/* Stat cards: 3-D flip entrance + magnetic hover (JS adds transform) */
.stat-card.fade-up{
  opacity:0;
  transform:perspective(700px) rotateX(18deg) translateY(20px) scale(0.97);
  transition:opacity 0.55s cubic-bezier(.22,1,.36,1),transform 0.55s cubic-bezier(.22,1,.36,1),background 0.25s;
}
.stat-card.fade-up.visible{opacity:1;transform:perspective(700px) rotateX(0deg) translateY(0) scale(1);}

/* Stat value shimmer after reveal */
.stat-value{position:relative;overflow:hidden;}
.stat-value::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent);transform:translateX(-100%);animation:shimmer 0.9s ease 1.3s forwards;pointer-events:none;}
@keyframes shimmer{to{transform:translateX(200%);}}

/* Stat bar spring */
.stat-bar-fill{transition:width 1.15s cubic-bezier(.34,1.56,.64,1) 0.55s !important;}

/* Timeline slot wipe */
.time-slot{clip-path:inset(0 100% 0 0);transition:clip-path 0.65s cubic-bezier(.16,1,.3,1),background 0.2s;}
.time-slot.slot-revealed{clip-path:inset(0 0% 0 0);}

/* Score pill physics pop */
.slot-score-pill{transition:opacity 0.45s cubic-bezier(.34,1.56,.64,1),transform 0.45s cubic-bezier(.34,1.56,.64,1),box-shadow 0.3s !important;}
.time-slot:hover .slot-score-pill{transform:scale(1.2) rotate(-5deg) !important;}

/* Refresh button ripple */
.refresh-btn{position:relative;overflow:hidden;}
.refresh-btn::before{content:'';position:absolute;inset:-2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);transform:translateX(-200%);transition:transform 0s;}
.refresh-btn:hover::before{transform:translateX(200%);transition:transform 0.6s ease;}

/* Section header letter-spacing reveal */
.section-header{overflow:hidden;}
.section-header-inner{display:inline-block;animation:sectionReveal 0.7s cubic-bezier(.16,1,.3,1) both;}
@keyframes sectionReveal{from{opacity:0;letter-spacing:8px;transform:translateX(-8px);}to{opacity:1;letter-spacing:3px;transform:translateX(0);}}

/* Scroll-triggered */
.scroll-reveal{opacity:0;transform:translateY(28px);transition:opacity 0.65s cubic-bezier(.22,1,.36,1),transform 0.65s cubic-bezier(.22,1,.36,1);}
.scroll-reveal.in-view{opacity:1;transform:translateY(0);}

/* Day label kerning reveal */
.day-label{animation:none;}
.day-label.dl-reveal{animation:dayReveal 0.7s cubic-bezier(.16,1,.3,1) both;}
@keyframes dayReveal{from{opacity:0;letter-spacing:8px;}to{opacity:1;letter-spacing:3px;}}

/* Wave canvas depth */
#waveCanvas{will-change:transform;}


/* ── TIDE SECTION ──────────────────────────────── */
.tide-section{border-bottom:var(--border);padding-bottom:0;}

/* Tide stat card — 5th card, full-width row below the 4 */
.tide-card{
  padding:28px 28px 24px;
  border-top:var(--border);
  position:relative;
  overflow:hidden;
  cursor:default;
  transition:background 0.25s;
}
.tide-card:hover{background:var(--g850);}
.tide-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px;}
.tide-meta{flex:0 0 auto;}
.tide-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--g500);margin-bottom:10px;}
.tide-value-row{display:flex;align-items:baseline;gap:6px;}
.tide-value{font-family:'Space Mono',monospace;font-size:30px;font-weight:700;line-height:1;letter-spacing:-1px;}
.tide-unit{font-size:13px;color:var(--g500);font-weight:400;}
.tide-state{font-size:11px;color:var(--g500);margin-top:6px;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;gap:6px;}
.tide-arrow{display:inline-block;transition:transform 0.6s cubic-bezier(.34,1.56,.64,1);}
.tide-arrow.rising{transform:rotate(-45deg);}
.tide-arrow.falling{transform:rotate(45deg);}

/* Extremes list */
.tide-extremes{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
.tide-extreme{text-align:center;}
.tide-extreme-type{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--g500);margin-bottom:4px;}
.tide-extreme-time{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--g300);letter-spacing:1px;}
.tide-extreme-h{font-family:'Space Mono',monospace;font-size:10px;color:var(--g500);margin-top:2px;}
.tide-extreme.next .tide-extreme-type{color:var(--g300);}
.tide-extreme.next .tide-extreme-time{color:var(--white);}

/* SVG curve */
.tide-curve-wrap{position:relative;width:100%;height:72px;}
#tideCurveSvg{width:100%;height:72px;overflow:visible;}
.tide-curve-path{fill:none;stroke:#2a2a2a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.tide-curve-path-animated{fill:none;stroke:var(--white);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2000;stroke-dashoffset:2000;transition:stroke-dashoffset 1.8s cubic-bezier(.16,1,.3,1) 0.3s;}
.tide-curve-path-animated.drawn{stroke-dashoffset:0;}
.tide-fill-path{fill:url(#tideGrad);opacity:0;transition:opacity 1s ease 0.8s;}
.tide-fill-path.drawn{opacity:1;}
.tide-now-line{stroke:#333;stroke-width:1;stroke-dasharray:3 3;}
.tide-now-dot{fill:var(--white);transition:r 0.3s cubic-bezier(.34,1.56,.64,1);}
.tide-now-label{font-family:'Space Mono',monospace;font-size:8px;fill:#555;letter-spacing:1px;}
.tide-axis-label{font-family:'Space Mono',monospace;font-size:7px;fill:#333;letter-spacing:1px;}

/* Bar at top like stat cards */
.tide-bar{height:2px;width:100%;margin-bottom:20px;background:#1a1a1a;position:relative;overflow:hidden;}
.tide-bar-fill{height:100%;background:var(--white);width:0%;transition:width 1.2s cubic-bezier(.34,1.56,.64,1) 0.4s;}


/* ── BARREL PREDICTION ─────────────────────────── */
.barrel-block{
  margin-top:20px;
  padding:20px 0 0;
  border-top:1px solid #111;
  display:flex;
  align-items:flex-start;
  gap:28px;
  flex-wrap:wrap;
  opacity:0;
  transform:translateY(10px);
  transition:opacity 0.6s cubic-bezier(.22,1,.36,1) 0.4s, transform 0.6s cubic-bezier(.22,1,.36,1) 0.4s;
}
.barrel-block.visible{opacity:1;transform:translateY(0);}

/* probability ring — smaller than score ring */
.barrel-ring-wrap{flex-shrink:0;width:80px;height:80px;}
.barrel-ring-svg{width:80px;height:80px;}
.barrel-ring-track{fill:none;stroke:#1a1a1a;stroke-width:5;}
.barrel-ring-fill{
  fill:none;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:220.9;stroke-dashoffset:220.9;
  transition:stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1) 0.5s, stroke 0.4s;
}
.barrel-ring-pct{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;dominant-baseline:central;text-anchor:middle;fill:white;}
.barrel-ring-label{font-family:'Space Mono',monospace;font-size:7px;dominant-baseline:central;text-anchor:middle;fill:#555;letter-spacing:1.5;}

.barrel-text{flex:1;min-width:160px;}
.barrel-headline{
  font-family:'Space Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--g300);
  margin-bottom:6px;
}
.barrel-headline.hot{color:var(--white);}
.barrel-desc{font-size:12px;color:var(--g500);line-height:1.7;font-family:'Space Grotesk',sans-serif;max-width:420px;}

/* factor bars */
.barrel-factors{margin-top:12px;display:flex;flex-direction:column;gap:5px;}
.barrel-factor{display:flex;align-items:center;gap:10px;}
.barrel-factor-name{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--g500);width:58px;flex-shrink:0;}
.barrel-factor-track{flex:1;height:1px;background:#1a1a1a;position:relative;}
.barrel-factor-fill{height:100%;width:0%;background:var(--g500);transition:width 1s cubic-bezier(.34,1.56,.64,1);position:absolute;top:0;left:0;}
.barrel-factor-fill.on{background:var(--white);}
.barrel-factor-val{font-family:'Space Mono',monospace;font-size:8px;color:var(--g500);width:28px;text-align:right;flex-shrink:0;}

/* timeline barrel badge */
.slot-barrel{
  display:inline-block;
  font-family:'Space Mono',monospace;
  font-size:7px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:2px 5px;
  border:1px solid #2a2a2a;
  color:var(--g500);
  margin-top:5px;
  transition:border-color 0.3s, color 0.3s;
}
.slot-barrel.hot{border-color:rgba(255,255,255,0.25);color:var(--g300);}
.slot-barrel.firing-barrel{border-color:rgba(255,255,255,0.5);color:var(--white);}

<script>

/* ══════════════════════════════════════════════
   MOTION ENGINE
══════════════════════════════════════════════ */
(function(){
  /* ── Custom cursor ── */
  const dot  = document.createElement('div'); dot.id  = 'cursor-dot';
  const ring = document.createElement('div'); ring.id = 'cursor-ring';
  document.body.append(dot, ring);

  let mx=window.innerWidth/2, my=window.innerHeight/2;
  let rx=mx, ry=my;
  let raf;

  document.addEventListener('mousemove', e=>{
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+'px'; dot.style.top=my+'px';
  });
  document.addEventListener('mousedown',()=>ring.classList.add('clicking'));
  document.addEventListener('mouseup',()=>ring.classList.remove('clicking'));

  // Lag ring behind cursor
  function tickCursor(){
    rx += (mx-rx)*0.12;
    ry += (my-ry)*0.12;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(tickCursor);
  }
  tickCursor();

  document.querySelectorAll('button,input,[data-dir],.stat-card,.time-slot').forEach(el=>{
    el.addEventListener('mouseenter',()=>ring.classList.add('hovering'));
    el.addEventListener('mouseleave',()=>ring.classList.remove('hovering'));
  });

  /* ── Logo wrap ── */
  const logo = document.querySelector('.logo');
  if(logo){ logo.innerHTML = '<span class="logo-inner">'+logo.innerHTML+'</span>'; }

  /* ── Hero rating: char split ── */
  function splitChars(el){
    if(!el) return;
    const text = el.textContent.trim();
    el.innerHTML = text.split('').map((c,i)=>`<span class="char-wrap"><span class="char" style="animation-delay:${0.05+i*0.06}s">${c}</span></span>`).join('');
  }

  /* ── Magnetic elements ── */
  function initMagnetics(){
    document.querySelectorAll('.stat-card,.refresh-btn').forEach(el=>{
      el.addEventListener('mousemove', e=>{
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const dx = (e.clientX - cx) / (r.width/2);
        const dy = (e.clientY - cy) / (r.height/2);
        const strength = el.classList.contains('refresh-btn') ? 6 : 4;
        el.style.transform = `translate(${dx*strength}px,${dy*strength}px) perspective(700px) rotateX(${-dy*3}deg) rotateY(${dx*3}deg) scale(1.01)`;
      });
      el.addEventListener('mouseleave', e=>{
        // spring back
        el.style.transition = 'transform 0.6s cubic-bezier(.34,1.56,.64,1), background 0.25s';
        el.style.transform = '';
        setTimeout(()=>el.style.transition='',650);
      });
      el.addEventListener('mouseenter', e=>{
        el.style.transition = 'transform 0.15s ease, background 0.25s';
      });
    });
  }

  /* ── Scroll parallax for hero rating ── */
  function initScrollFx(){
    window.addEventListener('scroll', ()=>{
      const sy = window.scrollY;
      const hr = document.getElementById('heroRating');
      if(hr) hr.style.transform = `translateY(${sy*0.18}px) scale(${1 - sy*0.00015})`;
      const wc = document.getElementById('waveCanvas');
      if(wc) wc.style.transform = `translateY(${sy * -0.06}px)`;
    }, {passive:true});
  }

  /* ── Timeline slot wipe (staggered) ── */
  function revealSlots(){
    document.querySelectorAll('.time-slot').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('slot-revealed'), 300 + i*80);
    });
  }

  /* ── Scroll-reveal observer ── */
  function initScrollReveal(){
    document.querySelectorAll('.timeline-section,.day-block').forEach(el=>{
      el.classList.add('scroll-reveal');
    });
    const obs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){ e.target.classList.add('in-view'); obs.unobserve(e.target); }
      });
    },{threshold:0.08});
    document.querySelectorAll('.scroll-reveal').forEach(el=>obs.observe(el));
  }

  /* ── Day label reveal on scroll ── */
  function initDayLabels(){
    const obs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){ e.target.classList.add('dl-reveal'); obs.unobserve(e.target); }
      });
    },{threshold:0.5});
    document.querySelectorAll('.day-label').forEach(el=>obs.observe(el));
  }

  /* ── Section header wrap ── */
  function wrapSectionHeaders(){
    document.querySelectorAll('.section-header').forEach(el=>{
      if(!el.querySelector('.section-header-inner'))
        el.innerHTML = `<span class="section-header-inner">${el.innerHTML}</span>`;
    });
  }

  /* ── Refresh button: track mouse for highlight ── */
  function initBtnFx(){
    const btn = document.getElementById('refreshBtn');
    if(!btn) return;
    btn.addEventListener('mousemove', e=>{
      const r = btn.getBoundingClientRect();
      btn.style.setProperty('--rx', ((e.clientX-r.left)/r.width*100)+'%');
      btn.style.setProperty('--ry', ((e.clientY-r.top)/r.height*100)+'%');
    });
  }

  /* ── Wire everything after render ── */
  window._motionAfterRender = function(){
    splitChars(document.getElementById('heroRating'));
    initMagnetics();
    initScrollFx();
    revealSlots();
    initScrollReveal();
    initDayLabels();
    wrapSectionHeaders();
    initBtnFx();
    // re-attach cursor hovering to new elements
    document.querySelectorAll('.stat-card,.time-slot,[data-dir]').forEach(el=>{
      el.addEventListener('mouseenter',()=>ring.classList.add('hovering'));
      el.addEventListener('mouseleave',()=>ring.classList.remove('hovering'));
    });
  };
})();


/* ═══════════════════════════════════════
   TIDE — WorldTides API
═══════════════════════════════════════ */
const TIDE_KEY = 'e0f2dd49-9d09-4bbd-9c12-041b990b5b69';
const TIDE_CACHE_KEY = 'shakabro_tide_cache';
const TIDE_CACHE_TTL = 3 * 60 * 60 * 1000;

function getTideCached() {
  try {
    const raw = sessionStorage.getItem(TIDE_CACHE_KEY);
    if (!raw) return null;
    const {ts, data} = JSON.parse(raw);
    if (Date.now() - ts > TIDE_CACHE_TTL) return null;
    return data;
  } catch { return null; }
}
function setTideCache(data) {
  try { sessionStorage.setItem(TIDE_CACHE_KEY, JSON.stringify({ts:Date.now(), data})); } catch {}
}

async function fetchTides(force=false) {
  if (!force) { const c = getTideCached(); if (c) return c; }
  const url = `https://www.worldtides.info/api/v3?heights&extremes&lat=${LAT}&lon=${LNG}&key=${TIDE_KEY}&days=2&step=900`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Tide API ' + res.status);
  const data = await res.json();
  setTideCache(data);
  return data;
}

function renderTide(tideData) {
  const now = Date.now() / 1000; // unix seconds
  window._tideData = tideData;
  const heights  = tideData.heights  || [];
  const extremes = tideData.extremes || [];

  // Current height via linear interpolation
  let curH = 0;
  for (let i = 0; i < heights.length - 1; i++) {
    if (heights[i].dt <= now && heights[i+1].dt >= now) {
      const t = (now - heights[i].dt) / (heights[i+1].dt - heights[i].dt);
      curH = heights[i].height + t * (heights[i+1].height - heights[i].height);
      break;
    }
  }

  // Rising or falling
  let rising = true;
  for (let i = 0; i < heights.length - 1; i++) {
    if (heights[i].dt <= now && heights[i+1].dt >= now) {
      rising = heights[i+1].height > heights[i].height;
      break;
    }
  }

  // Next 4 extremes
  const upcoming = extremes.filter(e => e.dt > now - 1800).slice(0, 4);

  // Filter heights to ±12h window for the curve
  const win = 12 * 3600;
  const slice = heights.filter(h => h.dt >= now - win && h.dt <= now + win);
  if (!slice.length) return;

  const minH = Math.min(...slice.map(h=>h.height));
  const maxH = Math.max(...slice.map(h=>h.height));
  const pad  = (maxH - minH) * 0.15 || 0.1;
  const lo = minH - pad, hi = maxH + pad;

  const W = 1000, H = 60; // SVG coordinate space
  const toX = dt => ((dt - slice[0].dt) / (slice[slice.length-1].dt - slice[0].dt)) * W;
  const toY = h  => H - ((h - lo) / (hi - lo)) * H;

  // Build smooth curve path (cubic bezier through points)
  function smoothPath(pts) {
    if (!pts.length) return '';
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const prev = pts[i-1], cur = pts[i];
      const cpx = (prev.x + cur.x) / 2;
      d += ` C ${cpx} ${prev.y}, ${cpx} ${cur.y}, ${cur.x} ${cur.y}`;
    }
    return d;
  }

  const pts = slice.map(h => ({x: toX(h.dt), y: toY(h.height)}));
  const pathD = smoothPath(pts);
  const fillD = pathD + ` L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`;

  // Now marker
  const nowX = toX(now);
  const nowY = toY(curH);

  // Tide bar fill percent (where in tidal range are we)
  const tidePct = Math.round(((curH - minH) / (maxH - minH || 1)) * 100);

  // Format time
  const fmt = dt => new Date(dt*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});

  const extremeHTML = upcoming.map((e,i) => `
    <div class="tide-extreme ${i===0?'next':''}">
      <div class="tide-extreme-type">${e.type}</div>
      <div class="tide-extreme-time">${fmt(e.dt)}</div>
      <div class="tide-extreme-h">${e.height.toFixed(2)}m</div>
    </div>`).join('');

  // Axis labels: every 3h
  let axisLabels = '';
  const step = 3 * 3600;
  const start = slice[0].dt;
  const end   = slice[slice.length-1].dt;
  for (let t = Math.ceil(start/step)*step; t <= end; t += step) {
    const x = toX(t);
    const lbl = new Date(t*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
    axisLabels += `<text class="tide-axis-label" x="${x}" y="${H+12}" text-anchor="middle">${lbl}</text>`;
  }

  const html = `
    <div class="section-header tide-section"><span class="section-header-inner">Tide</span></div>
    <div class="tide-card fade-up">
      <div class="tide-bar"><div class="tide-bar-fill" id="tideBarFill" style="width:0%"></div></div>
      <div class="tide-card-top">
        <div class="tide-meta">
          <div class="tide-label">Current Height</div>
          <div class="tide-value-row">
            <span class="tide-value" id="tideVal">0.00</span>
            <span class="tide-unit">m</span>
          </div>
          <div class="tide-state">
            <span class="tide-arrow ${rising?'rising':'falling'}">${rising?'↑':'↓'}</span>
            <span>${rising ? 'Rising' : 'Falling'}</span>
          </div>
        </div>
        <div class="tide-extremes">${extremeHTML}</div>
      </div>
      <div class="tide-curve-wrap">
        <svg id="tideCurveSvg" viewBox="-10 -8 1020 88" preserveAspectRatio="none">
          <defs>
            <linearGradient id="tideGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="white" stop-opacity="0.06"/>
              <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <!-- ghost track -->
          <path class="tide-curve-path" d="${pathD}"/>
          <!-- fill -->
          <path class="tide-fill-path" id="tideFill" d="${fillD}"/>
          <!-- animated line -->
          <path class="tide-curve-path-animated" id="tideLine" d="${pathD}"/>
          <!-- now marker -->
          <line class="tide-now-line" x1="${nowX}" y1="-4" x2="${nowX}" y2="${H+4}"/>
          <circle class="tide-now-dot" cx="${nowX}" cy="${nowY}" r="4"/>
          <!-- axis -->
          ${axisLabels}
        </svg>
      </div>
    </div>`;

  // Inject after stats grid
  const statsGrid = document.querySelector('.stats-grid');
  if (statsGrid) {
    const tideDiv = document.createElement('div');
    tideDiv.id = 'tideBlock';
    tideDiv.innerHTML = html;
    statsGrid.after(tideDiv);
  }

  // Animate in
  requestAnimationFrame(() => {
    // count-up the tide value
    const tideValEl = document.getElementById('tideVal');
    if (tideValEl) {
      let start = 0, dur = 1200, begin = Date.now();
      function countUp() {
        const p = Math.min(1, (Date.now()-begin)/dur);
        // ease out expo
        const e = p === 1 ? 1 : 1 - Math.pow(2, -10*p);
        tideValEl.textContent = (curH * e).toFixed(2);
        if (p < 1) requestAnimationFrame(countUp);
        else tideValEl.textContent = curH.toFixed(2);
      }
      setTimeout(countUp, 300);
    }

    // bar fill
    setTimeout(() => {
      const bar = document.getElementById('tideBarFill');
      if (bar) bar.style.width = tidePct + '%';
    }, 200);

    // fade-up card
    setTimeout(() => {
      document.querySelector('.tide-card')?.classList.add('visible');
    }, 100);

    // curve draw
    setTimeout(() => {
      document.getElementById('tideLine')?.classList.add('drawn');
      document.getElementById('tideFill')?.classList.add('drawn');
    }, 250);

    // now dot pulse
    const dot = document.querySelector('.tide-now-dot');
    if (dot) {
      setTimeout(() => {
        dot.style.r = '6';
        setTimeout(() => { dot.style.r = '4'; }, 350);
      }, 1400);
    }
  });
}


/* ═══════════════════════════════════════
   BARREL PREDICTION
═══════════════════════════════════════ */

// tideData is stored globally so barrel scoring can use it per-slot
window._tideData = null;

function getTideHeightAt(unixSec) {
  const td = window._tideData;
  if (!td || !td.heights || !td.heights.length) return null;
  const h = td.heights;
  for (let i = 0; i < h.length - 1; i++) {
    if (h[i].dt <= unixSec && h[i+1].dt >= unixSec) {
      const t = (unixSec - h[i].dt) / (h[i+1].dt - h[i].dt);
      return h[i].height + t * (h[i+1].height - h[i].height);
    }
  }
  return null;
}

function getTidalRangeForDay(unixSec) {
  // look at extremes within ±18h of the target time
  const td = window._tideData;
  if (!td || !td.extremes) return null;
  const nearby = td.extremes.filter(e => Math.abs(e.dt - unixSec) < 18*3600);
  if (nearby.length < 2) return null;
  const highs = nearby.filter(e=>e.type==='High').map(e=>e.height);
  const lows  = nearby.filter(e=>e.type==='Low').map(e=>e.height);
  if (!highs.length || !lows.length) return null;
  return { high: Math.max(...highs), low: Math.min(...lows) };
}



function scoreBarrel(waveHeight, period, swellDir, windSpeed, windDir) {
  // Each factor 0–1, then weighted sum → 0–100%
  // Period: needs 11s+ for the reef to jack
  let periodScore;
  if (period >= 13)      periodScore = 1.0;
  else if (period >= 12) periodScore = 0.9;
  else if (period >= 11) periodScore = 0.75;
  else if (period >= 10) periodScore = 0.45;
  else if (period >= 9)  periodScore = 0.2;
  else                   periodScore = 0.05;

  // Height: 0.8–1.5m ideal for hollow on this reef
  let heightScore;
  if (waveHeight >= 0.8 && waveHeight <= 1.5)      heightScore = 1.0;
  else if (waveHeight >= 0.6 && waveHeight < 0.8)  heightScore = 0.6;
  else if (waveHeight > 1.5 && waveHeight <= 2.0)  heightScore = 0.65;
  else if (waveHeight > 2.0)                        heightScore = 0.3; // closeout territory
  else                                               heightScore = 0.2;

  // Swell direction: SE (120–160°) hits the reef angle perfectly
  let dirScore;
  const d = swellDir;
  if (d >= 125 && d <= 155)      dirScore = 1.0;
  else if (d >= 110 && d <= 165) dirScore = 0.75;
  else if (d >= 90  && d <= 180) dirScore = 0.4;
  else                            dirScore = 0.1;

  // Wind: offshore W/WSW holds the lip
  const inOff = windDir >= 235 && windDir <= 295;
  let windScore;
  if (inOff && windSpeed >= 5 && windSpeed <= 15)      windScore = 1.0;
  else if (inOff && windSpeed < 5)                     windScore = 0.75; // light offshore still ok
  else if (inOff && windSpeed > 15)                    windScore = 0.5;  // too strong, messes with entry
  else if (windSpeed < 6)                              windScore = 0.55; // light any direction passable
  else                                                  windScore = 0.1;

  // Weighted: period and direction are the biggest factors for hollowness on a reef
  const raw = (
    periodScore * 0.35 +
    dirScore    * 0.30 +
    windScore   * 0.22 +
    heightScore * 0.13
  );

  return {
    pct: Math.round(raw * 100),
    factors: {
      period:  Math.round(periodScore * 100),
      dir:     Math.round(dirScore    * 100),
      wind:    Math.round(windScore   * 100),
      height:  Math.round(heightScore * 100),
    }
  };
}

function barrelLabel(pct) {
  if (pct >= 80) return 'LIKELY BARRELLING';
  if (pct >= 60) return 'POSSIBLE BARRELS';
  if (pct >= 40) return 'OCCASIONAL SECTIONS';
  if (pct >= 20) return 'MOSTLY CRUMBLING';
  return 'NOT TODAY';
}

function barrelDesc(pct, period, waveHeight, swellDir, windDir, windSpeed) {
  const d = degToCompass(swellDir), wd = degToCompass(windDir);
  if (pct >= 80) return `${waveHeight.toFixed(1)}m ${d} groundswell at ${period.toFixed(1)}s with ${wd} wind — reef is going to throw. Expect proper barrels on the sets.`;
  if (pct >= 60) return `${period.toFixed(1)}s ${d} swell has the period to jack on the reef. Wind and angle are lining up — hollow sections on the better sets.`;
  if (pct >= 40) {
    const weak = period < 11 ? 'Period too short to jack properly' : swellDir < 110 || swellDir > 165 ? 'Swell angle missing the reef' : 'Wind conditions limiting it';
    return `${weak}. Might see the odd square section but mostly walls.`;
  }
  if (pct >= 20) return `Conditions aren't right for this reef today — ${period < 10 ? 'period too short' : 'swell angle off'}, waves will crumble rather than pitch.`;
  return `Nothing to get excited about. Check back when the SE swell fills in.`;
}

function renderBarrelBlock(wh, period, swellDir, windSpeed, windDir) {
  const {pct, factors} = scoreBarrel(wh, period, swellDir, windSpeed, windDir);
  const label = barrelLabel(pct);
  const desc  = barrelDesc(pct, period, wh, swellDir, windDir, windSpeed);
  const isHot = pct >= 60;
  const circ  = 220.9;
  const offset = circ - (circ * pct / 100);

  // stroke color based on probability
  const stroke = pct >= 70 ? '#ffffff' : pct >= 50 ? '#aaaaaa' : pct >= 30 ? '#555555' : '#2a2a2a';

  const factorRows = [
    {name:'Period', val:factors.period},
    {name:'Dir',    val:factors.dir},
    {name:'Wind',   val:factors.wind},
    {name:'Height', val:factors.height},
  ].map(f => `
    <div class="barrel-factor">
      <span class="barrel-factor-name">${f.name}</span>
      <div class="barrel-factor-track">
        <div class="barrel-factor-fill ${f.val >= 60 ? 'on' : ''}" id="bfill-${f.name}" style="width:0%"></div>
      </div>
      <span class="barrel-factor-val">${f.val}%</span>
    </div>`).join('');

  return {pct, html: `
    <div class="barrel-block" id="barrelBlock">
      <div class="barrel-ring-wrap">
        <svg class="barrel-ring-svg" viewBox="0 0 80 80">
          <circle class="barrel-ring-track" cx="40" cy="40" r="35"/>
          <circle class="barrel-ring-fill" id="barrelRingFill" cx="40" cy="40" r="35"
            stroke="${stroke}" transform="rotate(-90 40 40)"
            style="stroke-dashoffset:${circ}"/>
          <text class="barrel-ring-pct" x="40" y="37">${pct}%</text>
          <text class="barrel-ring-label" x="40" y="51">BARREL</text>
        </svg>
      </div>
      <div class="barrel-text">
        <div class="barrel-headline ${isHot ? 'hot' : ''}">${label}</div>
        <div class="barrel-desc">${desc}</div>
        <div class="barrel-factors">${factorRows}</div>
      </div>
    </div>`};
}

/* ═══════════════════════════════════════
   WAVE CANVAS — ambient background
═══════════════════════════════════════ */
(function() {
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, t = 0;
  let ratingColor = [255,255,255];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = 220;
  }
  resize();
  window.addEventListener('resize', resize);

  function wave(amp, freq, phase, speed, alpha) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 3) {
      const y = H * 0.55
        + Math.sin(x * freq + phase + t * speed) * amp
        + Math.sin(x * freq * 1.7 + phase * 0.8 + t * speed * 1.3) * (amp * 0.45)
        + Math.sin(x * freq * 0.4 + t * speed * 0.6) * (amp * 0.3);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    const [r,g,b] = ratingColor;
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    wave(28, 0.007, 0,    0.6,  0.04);
    wave(20, 0.009, 2.1,  0.9,  0.05);
    wave(14, 0.013, 4.3,  1.2,  0.06);
    t += 0.016;
    requestAnimationFrame(loop);
  }
  loop();

  window.setWaveColor = function(r,g,b) { ratingColor = [r,g,b]; };
})();

/* ═══════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════ */
const LAT = 4.173, LNG = 73.488;
const TIMES = [8, 11, 14, 17];

/* ═══════════════════════════════════════
   SCORING — smooth interpolation
   No hard cliffs: a 0.1s or 2deg wobble
   from the API won't flip the rating.
═══════════════════════════════════════ */

// Linear interpolate x between [a,b] → [0,1], clamped
function lerp01(x, a, b) { return Math.max(0, Math.min(1, (x - a) / (b - a))); }

// Smooth blend between two zones across a transition band
// below lo → returns loVal, above hi → returns hiVal, in between → smooth ramp
function smooth(x, lo, hi, loVal, hiVal) {
  const t = lerp01(x, lo, hi);
  // ease in-out so the middle of the band doesn't snap
  const s = t * t * (3 - 2 * t);
  return loVal + s * (hiVal - loVal);
}

function scorePeriod(p) {
  // 0–30 pts. Dead zones below 8s and above 13s, smooth ramps between.
  if (p >= 13)   return 30;
  if (p >= 11.5) return smooth(p, 11.5, 13,   26, 30);
  if (p >= 10)   return smooth(p, 10,   11.5,  14, 26);
  if (p >= 8.5)  return smooth(p, 8.5,  10,     6, 14);
  return smooth(p, 6, 8.5, 1, 6);
}

function scoreHeight(h) {
  // 0–25 pts. Ideal 0.9–1.6m, tails off either side.
  if (h >= 0.9 && h <= 1.6) return 25;
  if (h > 1.6) return smooth(h, 1.6, 2.4, 25, 8);   // big → closes out
  if (h >= 0.5) return smooth(h, 0.5, 0.9, 5, 25);
  return smooth(h, 0, 0.5, 0, 5);
}

function scoreDir(d) {
  // 0–25 pts. Core window 120–155, soft edges to 95 and 185.
  if (d >= 120 && d <= 155) return 25;
  if (d > 155) return smooth(d, 155, 185, 25, 5);
  if (d >= 95) return smooth(d, 95,  120, 5,  25);
  return smooth(d, 70, 95, 0, 5);
}

function scoreWind(windSpeed, windDir) {
  // 0–20 pts. Offshore W/WSW (235–295) + moderate speed is ideal.
  const inOff = windDir >= 230 && windDir <= 300;
  // how offshore is it — soft edges at 230 and 300
  let dirFactor;
  if (windDir >= 235 && windDir <= 295) dirFactor = 1.0;
  else if (windDir >= 230)              dirFactor = smooth(windDir, 230, 235, 0.5, 1.0);
  else                                  dirFactor = smooth(windDir, 295, 300, 1.0, 0.5);

  // speed factor: ideal 6–14kn offshore, penalty for too light or too strong
  let speedFactor;
  if (windSpeed >= 6 && windSpeed <= 14)  speedFactor = 1.0;
  else if (windSpeed < 6)                 speedFactor = smooth(windSpeed, 0, 6, 0.5, 1.0);
  else                                    speedFactor = smooth(windSpeed, 14, 22, 1.0, 0.3);

  if (inOff) return 20 * dirFactor * speedFactor;

  // not offshore — light wind of any direction is passable
  if (windSpeed < 7) return smooth(windSpeed, 0, 7, 8, 10);
  // onshore/cross: penalty scales with strength
  return smooth(windSpeed, 7, 20, 8, 1);
}

function scoreConditions(waveHeight, period, swellDir, windSpeed, windDir) {
  const raw = scorePeriod(period) + scoreHeight(waveHeight) + scoreDir(swellDir) + scoreWind(windSpeed, windDir);
  let score = Math.min(10, raw / 10);

  // Hard direction cap: if swell1 is NOT from SE quadrant (120–160°),
  // the reef won't work regardless of other factors.
  // Outside 90–185° = wrong angle entirely → cap at POOR (4.7)
  // In 90–120 or 160–185 = marginal angle → cap at FAIR (6.7)
  if (swellDir < 90 || swellDir > 185) {
    score = Math.min(score, 4.7);
  } else if ((swellDir >= 90 && swellDir < 120) || (swellDir > 160 && swellDir <= 185)) {
    score = Math.min(score, 6.7);
  }

  // Period cap: swell1 under 9s means it's wind swell, not groundswell
  // Can't rate above FAIR no matter what else is happening
  if (period < 9) score = Math.min(score, 4.7);

  return score;
}

function ratingFromScore(s) {
  // Bands aligned with direction/period caps:
  // POOR cap = 4.7, FAIR cap = 6.7, so labels map cleanly
  if (s >= 8.5) return 'FIRING';
  if (s >= 6.8) return 'GOOD';
  if (s >= 4.8) return 'FAIR';
  return 'POOR';
}

function ratingClass(r) { return r.toLowerCase(); }

function ratingColor(r) {
  return {FIRING:[0,229,255], GOOD:[57,255,20], FAIR:[255,204,0], POOR:[255,59,48]}[r] || [255,255,255];
}

function qualClass(wh, period, waveDir, windSpd, windDir) {
  const s = scoreConditions(wh, period, waveDir, windSpd, windDir);
  return s >= 8.5 ? 'firing' : s >= 6.8 ? 'good' : s >= 4.8 ? 'fair' : 'poor';
}

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function degToCompass(deg) {
  const d=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return d[Math.round(deg/22.5)%16];
}
function mpsToKnots(mps) { return mps * 1.944; }
function uvToWindSpeedDir(u, v) {
  const speed = Math.sqrt(u*u + v*v);
  let dir = Math.atan2(-u,-v)*180/Math.PI;
  if (dir < 0) dir += 360;
  return {speed, dir};
}
function barPct(q) { return q==='firing'?100:q==='good'?80:q==='fair'?55:25; }

function buildBreakdown(wh, period, swellDir, windSpeed, windDir, score) {
  const d = degToCompass(swellDir), wd = degToCompass(windDir);
  const wq = wh >= 1.0 ? `${wh.toFixed(1)}m solid` : `${wh.toFixed(1)}m small`;
  const dirOk   = swellDir >= 120 && swellDir <= 160;
  const dirMarg = (swellDir >= 90 && swellDir < 120) || (swellDir > 160 && swellDir <= 185);
  if (!dirOk && !dirMarg) return `Primary swell (S1) from ${d} — wrong angle for this reef. Wait for SE groundswell.`;
  if (period < 9) return `${wh.toFixed(1)}m ${d} at only ${period.toFixed(1)}s — wind swell, won't hold shape on the reef.`;
  if (score >= 8) return `${wq} SE groundswell at ${period.toFixed(1)}s — ${wd} wind offshore, reef should be working well.`;
  if (score >= 6) return `${wq} ${d} swell at ${period.toFixed(1)}s — ${windSpeed > 15 ? 'wind a bit strong but offshore' : 'conditions lining up'}, worth a look.`;
  if (score >= 4) return `${wq} ${d} primary swell at ${period.toFixed(1)}s — ${dirMarg ? 'swell angle a bit off' : 'period on the low side'}, below ideal.`;
  return `Primary swell from ${d} at ${period.toFixed(1)}s — not enough to get excited about here.`;
}

/* ═══════════════════════════════════════
   COMPASS SVG
═══════════════════════════════════════ */
function compassSVG(deg, size=80) {
  const r = size/2;
  const rad = (deg - 90) * Math.PI / 180;
  const ax = r + Math.cos(rad)*r*0.55, ay = r + Math.sin(rad)*r*0.55;
  const bx = r + Math.cos(rad+Math.PI)*r*0.25, by = r + Math.sin(rad+Math.PI)*r*0.25;
  return `<svg class="compass-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${r}" cy="${r}" r="${r-2}" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
    <circle cx="${r}" cy="${r}" r="2.5" fill="#333"/>
    ${['N','E','S','W'].map((lbl,i)=>{
      const a=(i*90-90)*Math.PI/180;
      const tx=r+Math.cos(a)*(r-10), ty=r+Math.sin(a)*(r-10);
      return `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" fill="${lbl==='N'?'#fff':'#444'}" font-family="Space Mono,monospace" font-size="8" font-weight="700">${lbl}</text>`;
    }).join('')}
    <line x1="${bx}" y1="${by}" x2="${ax}" y2="${ay}" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <polygon points="${ax},${ay} ${r+Math.cos(rad+Math.PI*0.85)*12},${r+Math.sin(rad+Math.PI*0.85)*12} ${r+Math.cos(rad-Math.PI*0.85)*12},${r+Math.sin(rad-Math.PI*0.85)*12}" fill="white"/>
  </svg>`;
}

/* ═══════════════════════════════════════
   STAT CARD
═══════════════════════════════════════ */
function statCard(label, value, unit, sub, qClass, dirDeg, extraTooltip) {
  const pct = barPct(qClass);
  const dirAttr = dirDeg != null ? `data-dir="${dirDeg}"` : '';
  const tooltip = dirDeg != null ? `
    <div class="dir-tooltip">
      ${compassSVG(dirDeg, 80)}
      <div class="dir-label">${degToCompass(dirDeg)}</div>
      <div class="dir-deg">${Math.round(dirDeg)}&deg;</div>
      ${extraTooltip||''}
    </div>` : '';

  return `<div class="stat-card fade-up" ${dirAttr}>
    ${tooltip}
    <div class="stat-bar"><div class="stat-bar-fill ${qClass}" style="width:${pct}%"></div></div>
    <div class="stat-label">${label}</div>
    <div class="stat-value">${value}<span class="stat-unit">${unit}</span></div>
    <div class="stat-sub">${sub}</div>
    <div class="stat-quality-tag ${qClass}">${qClass}</div>
  </div>`;
}

/* ═══════════════════════════════════════
   TIME SLOT
═══════════════════════════════════════ */
function timeSlot(s, dayBestScore, idx) {
  const isBest = s.score === dayBestScore && s.score >= 5;
  const rc = ratingClass(s.rating);
  const delay = idx * 80;
  const bp = scoreBarrel(s.waveHeight, s.wavePeriod, s.waveDir, s.windSpeed, s.windDir);
  const bClass = bp.pct >= 70 ? 'firing-barrel' : bp.pct >= 50 ? 'hot' : '';
  const bLabel = bp.pct >= 70 ? 'BARREL' : bp.pct >= 50 ? 'HOLLOW' : bp.pct >= 30 ? 'SECTIONS' : '';
  return `<div class="time-slot ${isBest?'best-window':''}">
    <div class="slot-time">${String(s.targetHour).padStart(2,'0')}:00</div>
    <div class="slot-score-pill ${rc}" style="transition-delay:${delay}ms">${s.score.toFixed(1)}</div>
    <div class="slot-tag">${s.rating}</div>
    <div class="slot-detail">
      S1: ${s.waveHeight.toFixed(1)}m &middot; ${s.wavePeriod.toFixed(1)}s<br>
      ${degToCompass(s.waveDir)} &middot; ${s.windSpeed.toFixed(1)}kn ${degToCompass(s.windDir)}
    </div>
    ${bLabel ? `<div class="slot-barrel ${bClass}">${bLabel} ${bp.pct}%</div>` : ''}
  </div>`;
}

/* ═══════════════════════════════════════
   SCORE RING
═══════════════════════════════════════ */
function scoreRing(score, rating) {
  const circ = 282.7;
  const dash = circ - (circ * score / 10);
  const colorMap = {FIRING:'var(--c-firing)',GOOD:'var(--c-good)',FAIR:'var(--c-fair)',POOR:'var(--c-poor)'};
  return `<div class="score-ring-wrap" id="scoreRingWrap">
    <svg class="score-ring-svg" viewBox="0 0 110 110">
      <circle class="ring-track" cx="55" cy="55" r="45"/>
      <circle class="ring-fill" id="ringFill" cx="55" cy="55" r="45"
        stroke="${colorMap[rating]}"
        transform="rotate(-90 55 55)"
        style="stroke-dashoffset:${circ}"/>
      <text class="ring-text" x="55" y="50">${typeof score==='number'?score.toFixed(1):score}</text>
      <text class="ring-sub" x="55" y="67" letter-spacing="2">/10</text>
    </svg>
  </div>`;
}

/* ═══════════════════════════════════════
   RENDER
═══════════════════════════════════════ */
function render(data) {
  const points = parseData(data);
  if (!points.length) throw new Error('No data returned.');

  const now = new Date();
  const current = closestToHour(points, now);
  const scoreRaw = scoreConditions(current.waveHeight, current.wavePeriod, current.waveDir, current.windSpeed, current.windDir);
  const score = Math.round(scoreRaw * 10) / 10; // one decimal for display
  const rating = ratingFromScore(scoreRaw);
  const rc = ratingClass(rating);

  const todaySlots = getDaySlots(points, 0);
  const tomorrowSlots = getDaySlots(points, 1);

  document.getElementById('timestamp').textContent =
    now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}) + ' LOCAL';

  const breakdown = buildBreakdown(current.waveHeight, current.wavePeriod, current.waveDir, current.windSpeed, current.windDir, score);

  // stat quality classes — all driven by swell1 fields
  const swellQ = current.waveHeight >= 1.0 ? 'good' : current.waveHeight >= 0.6 ? 'fair' : 'poor';
  const periodQ = current.wavePeriod >= 11 ? 'good' : current.wavePeriod >= 9 ? 'fair' : 'poor';
  const windQ = (current.windDir >= 240 && current.windDir <= 290 && current.windSpeed <= 15) ? 'good' : current.windSpeed < 8 ? 'fair' : 'poor';
  const dirQ = (current.waveDir >= 120 && current.waveDir <= 160) ? 'good' : (current.waveDir >= 90 && current.waveDir <= 185) ? 'fair' : 'poor';

  const dirQualLabel = d => d >= 120 && d <= 160 ? 'Ideal SE window' : d >= 90 && d <= 185 ? 'Marginal angle' : 'Wrong direction';

  document.getElementById('mainContent').innerHTML = `
    <div class="hero">
      <div class="hero-label">Current Conditions</div>
      <div class="hero-rating ${rc}" id="heroRating">${rating}</div>
      <div class="hero-bottom">
        ${scoreRing(score, rating)}
        <div class="hero-breakdown" id="heroBreakdown">${breakdown}</div>
      </div>
      ${(()=>{ const b=renderBarrelBlock(current.waveHeight,current.wavePeriod,current.waveDir,current.windSpeed,current.windDir); window._pendingBarrel=b; return b.html; })()}
    </div>

    <div class="section-header">Conditions Now</div>
    <div class="stats-grid">
      ${statCard('Primary Swell', current.waveHeight.toFixed(1), 'm',
          `Swell 1 — ${degToCompass(current.waveDir)} origin`, swellQ, current.waveDir,
          `<div class="dir-deg" style="margin-top:6px;color:#555">swell1 only — drives rating</div>`)}
      ${statCard('Swell Period', current.wavePeriod.toFixed(1), 's',
          current.wavePeriod >= 11 ? 'Groundswell' : current.wavePeriod >= 9 ? 'Mid-swell' : 'Wind swell',
          periodQ, null)}
      ${statCard('Wind', current.windSpeed.toFixed(1), 'kn',
          `${degToCompass(current.windDir)} — ${Math.round(current.windDir)}&deg;`,
          windQ, current.windDir,
          `<div class="dir-deg" style="margin-top:6px;color:#555">ideal: W/WSW 240–290&deg;</div>`)}
      ${statCard('Swell 1 Dir', Math.round(current.waveDir), '&deg;',
          dirQualLabel(current.waveDir), dirQ, current.waveDir,
          `<div class="dir-deg" style="margin-top:6px;color:#555">ideal: 120–160&deg; SE</div>`)}
    </div>

    <div class="timeline-section">
      <div class="day-block">
        <div class="day-label">Today — ${now.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
        <div class="timeline-row">
          ${todaySlots.map((s,i) => timeSlot(s, Math.max(...todaySlots.map(x=>x.score)), i)).join('')}
        </div>
      </div>
      <div class="day-block">
        <div class="day-label">Tomorrow — ${new Date(now.getTime()+86400000).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
        <div class="timeline-row">
          ${tomorrowSlots.map((s,i) => timeSlot(s, Math.max(...tomorrowSlots.map(x=>x.score)), i)).join('')}
        </div>
      </div>
    </div>
  `;

  // Animate everything in
  const [wr,wg,wb] = ratingColor(rating);
  window.setWaveColor(wr,wg,wb);

  requestAnimationFrame(() => {
    // hero rating bounce in
    setTimeout(() => document.getElementById('heroRating')?.classList.add('visible'), 50);
    setTimeout(() => document.getElementById('heroBreakdown')?.classList.add('visible'), 200);

    // score ring
    const wrap = document.getElementById('scoreRingWrap');
    const fill = document.getElementById('ringFill');
    if (wrap && fill) {
      setTimeout(() => {
        wrap.classList.add('visible');
        const circ = 282.7;
        fill.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1) 0.15s, stroke 0.4s';
        fill.style.strokeDashoffset = circ - (circ * score / 10);
      }, 100);
    }

    // fade-up cards
    document.querySelectorAll('.fade-up').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), 120 + i * 60);
    });

    // timeline pills
    document.querySelectorAll('.slot-score-pill').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), 350 + i * 70);
    });
    // barrel block
    setTimeout(() => {
      const bb = document.getElementById('barrelBlock');
      if (bb) bb.classList.add('visible');
      const rf = document.getElementById('barrelRingFill');
      if (rf && window._pendingBarrel) {
        const circ = 220.9;
        rf.style.strokeDashoffset = circ - (circ * window._pendingBarrel.pct / 100);
      }
      // factor bars
      document.querySelectorAll('[id^="bfill-"]').forEach((el,i) => {
        const target = el.parentElement.nextElementSibling?.textContent || '';
        const pct = parseInt(target) || 0;
        setTimeout(() => { el.style.width = pct + '%'; }, i * 80);
      });
    }, 500);
    // motion layer
    setTimeout(() => { if(window._motionAfterRender) window._motionAfterRender(); }, 80);
  });
}

/* ═══════════════════════════════════════
   API + DATA
═══════════════════════════════════════ */
async function fetchWindy(apiKey) {
  const base = {lat:LAT, lon:LNG, levels:['surface'], key:apiKey};
  const [waveRes, windRes] = await Promise.all([
    fetch('https://api.windy.com/api/point-forecast/v2',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...base, model:'gfsWave', parameters:['waves','swell1','swell2']})}),
    fetch('https://api.windy.com/api/point-forecast/v2',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...base, model:'gfs', parameters:['wind']})})
  ]);
  if (!waveRes.ok) { const t=await waveRes.text(); throw new Error(`API ${waveRes.status}: ${t.slice(0,200)}`); }
  if (!windRes.ok) { const t=await windRes.text(); throw new Error(`API ${windRes.status}: ${t.slice(0,200)}`); }
  const [waveData, windData] = await Promise.all([waveRes.json(), windRes.json()]);
  const windByTs = {};
  (windData.ts||[]).forEach((t,i)=>{
    windByTs[t]={u:(windData['wind_u-surface']||[])[i]||0,v:(windData['wind_v-surface']||[])[i]||0};
  });
  waveData._windByTs = windByTs;
  return waveData;
}

function parseData(data) {
  const ts = data.ts, windByTs = data._windByTs||{};

  // PRIMARY: always use swell1 fields for scoring — never the combined 'waves' field
  // which blends wind swell and secondary swells and produces noisy ratings
  const s1h = data['swell1_height-surface']    || [];
  const s1p = data['swell1_period-surface']    || [];
  const s1d = data['swell1_direction-surface'] || [];

  // Keep overall wave height for display context (total sea state)
  const totalH = data['waves_height-surface']  || s1h;

  return ts.map((t,i) => {
    let wEntry = windByTs[t];
    if (!wEntry) {
      const nearest = Object.keys(windByTs).reduce((b,k)=>Math.abs(k-t)<Math.abs(b-t)?k:b, Object.keys(windByTs)[0]);
      wEntry = windByTs[nearest]||{u:0,v:0};
    }
    const wind = uvToWindSpeedDir(wEntry.u, wEntry.v);
    return {
      ts:t, date:new Date(t),
      // swell1 — what the rating is based on
      waveHeight: s1h[i] || 0,
      wavePeriod: s1p[i] || 0,
      waveDir:    s1d[i] || 0,
      // total sea state for display only
      totalHeight: totalH[i] || s1h[i] || 0,
      windSpeed: mpsToKnots(wind.speed),
      windDir:   wind.dir
    };
  });
}

function closestToHour(points, targetDate) {
  const tt = targetDate.getTime();
  return points.reduce((b,p)=>Math.abs(p.ts-tt)<Math.abs(b.ts-tt)?p:b, points[0]);
}

function getDaySlots(points, dayOffset) {
  const now = new Date(), day = new Date(now);
  day.setDate(day.getDate()+dayOffset);
  return TIMES.map(h=>{
    const target=new Date(day); target.setHours(h,0,0,0);
    const pt=closestToHour(points,target);
    const sRaw=scoreConditions(pt.waveHeight,pt.wavePeriod,pt.waveDir,pt.windSpeed,pt.windDir);
    const s=Math.round(sRaw*10)/10;
    return {...pt, targetHour:h, score:s, rating:ratingFromScore(sRaw)};
  });
}

/* ═══════════════════════════════════════
   LOAD
═══════════════════════════════════════ */
function showError(msg) {
  document.getElementById('errorBanner').textContent = msg;
  document.getElementById('errorBanner').classList.add('visible');
  document.getElementById('mainContent').innerHTML = `
    <div class="state-block">
      <div class="state-message">Could not load data</div>
      <div class="state-sub">Check your API key or try again shortly.</div>
    </div>`;
}

const CACHE_KEY = 'shakabro_cache';
const CACHE_TTL = 3 * 60 * 60 * 1000; // 3 hours

function getCached(apiKey) {
  try {
    const raw = sessionStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const { ts, key, data } = JSON.parse(raw);
    if (key !== apiKey) return null;           // different key — bust cache
    if (Date.now() - ts > CACHE_TTL) return null; // too old
    return data;
  } catch { return null; }
}

function setCache(apiKey, data) {
  try {
    // don't store the huge _windByTs blob under a clean key
    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), key: apiKey, data }));
  } catch { /* storage full — just skip */ }
}

async function loadData(forceRefresh = false) {
  const btn = document.getElementById('refreshBtn');
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  document.getElementById('errorBanner').classList.remove('visible');

  // Try cache first (unless user explicitly hit Refresh)
  if (!forceRefresh) {
    const cached = getCached(apiKey);
    if (cached) {
      render(cached);
      const age = Math.round((Date.now() - JSON.parse(sessionStorage.getItem(CACHE_KEY)).ts) / 60000);
      document.getElementById('timestamp').textContent += ` — cached ${age}m ago`;
      const tideCached = getTideCached();
      if (tideCached) renderTide(tideCached);
      else fetchTides(false).then(td=>{ if(td) renderTide(td); }).catch(()=>{});
      return;
    }
  }

  btn.disabled = true; btn.textContent = '...';
  document.getElementById('mainContent').innerHTML = `
    <div class="state-block">
      <div class="spinner"></div>
      <div class="state-message">Reading the ocean</div>
    </div>`;
  try {
    const [data, tideData] = await Promise.all([
      fetchWindy(apiKey),
      fetchTides(forceRefresh).catch(()=>null)
    ]);
    setCache(apiKey, data);
    render(data);
    if (tideData) renderTide(tideData);
  } catch(err) {
    showError('Error: '+err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Refresh';
  }
}

// Refresh button now forces a fresh fetch
document.getElementById('refreshBtn').onclick = () => loadData(true);

loadData(false);
</script>
